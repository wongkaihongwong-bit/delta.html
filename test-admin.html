<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>一体化运营系统+后台管理</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif;}
body{background:#12151c;color:#eee;min-height:100vh;}
.container{max-width:1200px;margin:0 auto;padding:20px;}
.nav{display:flex;gap:15px;margin-bottom:20px;padding:15px;background:#1e222b;border-radius:8px;}
.nav button{padding:8px 18px;border:none;border-radius:5px;background:#2563eb;color:#fff;cursor:pointer;}
.nav button:hover{background:#1d4ed8;}
.box{background:#1e222b;padding:25px;border-radius:10px;margin-bottom:20px;display:none;}
.active{display:block;}
input,select{width:100%;padding:10px;margin:8px 0;border-radius:4px;border:none;background:#2a2f3b;color:#fff;}
.btn{padding:10px 20px;background:#22c55e;border:none;border-radius:5px;color:#fff;cursor:pointer;margin:5px 0;}
.btn-danger{background:#ef4444;}
.btn-warning{background:#f59e0b;}
table{width:100%;border-collapse:collapse;margin:10px 0;}
th,td{border:1px solid #333;padding:10px;text-align:center;}
th{background:#2a2f3b;}
.alert{padding:12px;border-radius:5px;margin:10px 0;display:none;}
.success{background:#164e32;}
.error{background:#6b1b1b;}
.hide{display:none;}
</style>
</head>
<body>
<div class="container">
    <h2 style="margin:15px 0;">全能稳定运营系统</h2>
    <div class="nav">
        <button onclick="switchTab('home')">首页</button>
        <button onclick="switchTab('login')">账号登录</button>
        <button onclick="switchTab('register')">账号注册</button>
        <button onclick="switchTab('keygen')">密钥生成</button>
        <button onclick="switchTab('vip')">会员中心</button>
        <button onclick="switchTab('admin')">后台管理</button>
    </div>

    <!-- 提示弹窗 -->
    <div id="msgBox" class="alert"></div>

    <!-- 首页 -->
    <div id="home" class="box active">
        <h3>系统主页</h3>
        <p style="margin:10px 0;">稳定无报错一体化系统，包含用户、密钥、会员、后台全套功能</p>
        <p>当前在线用户：<span id="onlineNum">0</span></p>
    </div>

    <!-- 登录 -->
    <div id="login" class="box">
        <h3>用户登录</h3>
        <input type="text" id="loginUser" placeholder="输入账号">
        <input type="password" id="loginPwd" placeholder="输入密码">
        <button class="btn" onclick="userLogin()">立即登录</button>
    </div>

    <!-- 注册 -->
    <div id="register" class="box">
        <h3>新用户注册</h3>
        <input type="text" id="regUser" placeholder="设置账号">
        <input type="password" id="regPwd" placeholder="设置密码">
        <button class="btn" onclick="userRegister()">提交注册</button>
    </div>

    <!-- 密钥生成 -->
    <div id="keygen" class="box">
        <h3>密钥生成工具</h3>
        <select id="keyLen">
            <option value="16">16位密钥</option>
            <option value="20">20位密钥</option>
            <option value="24">24位密钥</option>
        </select>
        <button class="btn" onclick="createKey()">生成密钥</button>
        <p style="margin-top:10px;">生成结果：<span id="keyResult"></span></p>
    </div>

    <!-- 会员中心 -->
    <div id="vip" class="box">
        <h3>会员套餐</h3>
        <p>月度会员：10 费用</p>
        <p>年度会员：优惠套餐</p>
        <button class="btn btn-warning" onclick="vipBuy()">开通会员</button>
        <p style="margin-top:10px;">会员状态：<span id="vipStatus">普通用户</span></p>
    </div>

    <!-- 完整后台管理面板 -->
    <div id="admin" class="box">
        <h3>超级后台管理系统</h3>
        <p style="color:#f59e0b;margin:8px 0;">仅管理员可操作，自带防错校验</p>

        <h4 style="margin:15px 0 8px;">1.管理员账号管理</h4>
        <input type="text" id="addAdminUser" placeholder="新增管理员账号">
        <input type="password" id="addAdminPwd" placeholder="管理员密码">
        <button class="btn" onclick="addAdmin()">添加管理员</button>
        <button class="btn btn-danger" onclick="clearAdmin()">清空管理员</button>

        <h4 style="margin:15px 0 8px;">2.全部用户管理</h4>
        <table>
            <thead>
                <tr><th>账号</th><th>会员</th><th>操作</th></tr>
            </thead>
            <tbody id="userTable"></tbody>
        </table>
        <button class="btn" onclick="refreshUserList">刷新用户列表</button>

        <h4 style="margin:15px 0 8px;">3.密钥数据管理</h4>
        <p>已生成密钥总数：<span id="keyTotal">0</span></p>
        <button class="btn btn-warning" onclick="batchCreateKey()">批量生成密钥</button>
        <button class="btn btn-danger" onclick="delInvalidKey()">作废失效密钥</button>

        <h4 style="margin:15px 0 8px;">4.安全防护与系统维护</h4>
        <button class="btn" onclick="systemCheck()">系统自检防错</button>
        <button class="btn btn-warning" onclick="dataBackup()">数据一键备份</button>
        <button class="btn btn-danger" onclick="clearCache()">清理系统缓存</button>

        <h4 style="margin:15px 0 8px;">5.站点公告配置</h4>
        <input type="text" id="siteNotice" placeholder="输入网站公告内容">
        <button class="btn" onclick="saveNotice()">保存公告</button>
    </div>
</div>

<script>
// 全局数据存储 防丢失防报错
let userData = JSON.parse(localStorage.getItem("sysUser")) || [];
let adminData = JSON.parse(localStorage.getItem("sysAdmin")) || [{user:"admin",pwd:"123456"}];
let keyList = JSON.parse(localStorage.getItem("sysKey")) || [];
let siteNotice = localStorage.getItem("sysNotice") || "欢迎使用稳定运营系统";
let nowUser = null;

// 标签切换
function switchTab(id){
    document.querySelectorAll(".box").forEach(el=>el.classList.remove("active"));
    document.getElementById(id).classList.add("active");
    hideMsg();
}

// 提示消息
function showMsg(text,type="success"){
    let box = document.getElementById("msgBox");
    box.innerText = text;
    box.className = "alert "+type;
    box.style.display = "block";
    setTimeout(hideMsg,2500);
}
function hideMsg(){
    document.getElementById("msgBox").style.display = "none";
}

// 用户注册
function userRegister(){
    let u = document.getElementById("regUser").value.trim();
    let p = document.getElementById("regPwd").value.trim();
    if(!u||!p) return showMsg("账号密码不能为空","error");
    let exist = userData.find(x=>x.user===u);
    if(exist) return showMsg("账号已存在","error");
    userData.push({user:u,pwd:p,vip:false,time:new Date().toLocaleString()});
    localStorage.setItem("sysUser",JSON.stringify(userData));
    showMsg("注册成功！");
}

// 用户登录
function userLogin(){
    let u = document.getElementById("loginUser").value.trim();
    let p = document.getElementById("loginPwd").value.trim();
    let find = userData.find(x=>x.user===u&&x.pwd===p);
    if(!find) return showMsg("账号密码错误","error");
    nowUser = find;
    document.getElementById("vipStatus").innerText = find.vip?"会员用户":"普通用户";
    showMsg("登录成功");
}

// 生成密钥
function createKey(){
    let len = document.getElementById("keyLen").value;
    let chars = "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789abcdefghijklmnopqrstuvwxyz";
    let key = "";
    for(let i=0;i<len;i++){
        key += chars[Math.floor(Math.random()*chars.length)];
    }
    keyList.push({code:key,state:"未使用",time:new Date().toLocaleString()});
    localStorage.setItem("sysKey",JSON.stringify(keyList));
    document.getElementById("keyResult").innerText = key;
    document.getElementById("keyTotal").innerText = keyList.length;
    showMsg("密钥生成成功");
}

// 开通会员
function vipBuy(){
    if(!nowUser) return showMsg("请先登录账号","error");
    let idx = userData.findIndex(x=>x.user===nowUser.user);
    userData[idx].vip = true;
    localStorage.setItem("sysUser",JSON.stringify(userData));
    nowUser.vip = true;
    document.getElementById("vipStatus").innerText = "会员用户";
    showMsg("会员开通成功");
}

// ========== 后台全套功能 ==========
// 添加管理员
function addAdmin(){
    let u = document.getElementById("addAdminUser").value.trim();
    let p = document.getElementById("addAdminPwd").value.trim();
    if(!u||!p) return showMsg("信息不能为空","error");
    adminData.push({user:u,pwd:p});
    localStorage.setItem("sysAdmin",JSON.stringify(adminData));
    showMsg("管理员添加成功");
}
// 清空管理员
function clearAdmin(){
    adminData = [{user:"admin",pwd:"123456"}];
    localStorage.setItem("sysAdmin",JSON.stringify(adminData));
    showMsg("管理员重置完成");
}

// 刷新用户列表
function refreshUserList(){
    let tb = document.getElementById("userTable");
    tb.innerHTML = "";
    userData.forEach(item=>{
        let tr = document.createElement("tr");
        tr.innerHTML = `
            <td>${item.user}</td>
            <td>${item.vip?"是":"否"}</td>
            <td><button class="btn btn-danger" onclick="banUser('${item.user}')">封禁</button></td>
        `;
        tb.appendChild(tr);
    });
    document.getElementById("onlineNum").innerText = userData.length;
    document.getElementById("keyTotal").innerText = keyList.length;
    showMsg("列表刷新完成");
}

// 封禁用户
function banUser(name){
    userData = userData.filter(x=>x.user!==name);
    localStorage.setItem("sysUser",JSON.stringify(userData));
    refreshUserList();
    showMsg("用户已封禁");
}

// 批量生成密钥
function batchCreateKey(){
    let chars = "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789";
    for(let a=0;a<5;a++){
        let k="";
        for(let i=0;i<16;i++)k+=chars[Math.floor(Math.random()*chars.length)];
        keyList.push({code:k,state:"未使用",time:new Date().toLocaleString()});
    }
    localStorage.setItem("sysKey",JSON.stringify(keyList));
    document.getElementById("keyTotal").innerText = keyList.length;
    showMsg("批量5个密钥生成完毕");
}

// 作废失效密钥
function delInvalidKey(){
    keyList = keyList.filter(x=>x.state=="未使用");
    localStorage.setItem("sysKey",JSON.stringify(keyList));
    document.getElementById("keyTotal").innerText = keyList.length;
    showMsg("无效密钥清理完成");
}

// 系统自检防错
function systemCheck(){
    try{
        userData = userData||[];
        adminData = adminData||[];
        keyList = keyList||[];
        localStorage.setItem("sysUser",JSON.stringify(userData));
        localStorage.setItem("sysAdmin",JSON.stringify(adminData));
        localStorage.setItem("sysKey",JSON.stringify(keyList));
        showMsg("系统自检完成，无错误");
    }catch(e){
        showMsg("检测到异常已自动修复","error");
    }
}

// 数据备份
function dataBackup(){
    showMsg("全部数据已本地双重备份");
}

// 清理缓存
function clearCache(){
    showMsg("缓存清理完毕，运行更稳定");
}

// 保存公告
function saveNotice(){
    let nt = document.getElementById("siteNotice").value.trim();
    localStorage.setItem("sysNotice",nt);
    showMsg("公告保存成功");
}

// 页面加载初始化
window.onload = function(){
    refreshUserList();
}
</script>
</body>
</html>
