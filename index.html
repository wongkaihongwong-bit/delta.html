<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Delta全网统一密钥主控系统</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Consolas,"微软雅黑"}
body{background:#080808;color:#00ee77;padding:15px}
.main-box{max-width:1100px;margin:0 auto}
h2{color:#ffffff;margin:10px 0;border-bottom:1px solid #222;padding-bottom:8px}
.btn{padding:9px 18px;margin:5px;border:0;border-radius:3px;cursor:pointer;font-size:14px}
.btn-blue{background:#1967d2;color:#fff}
.btn-red{background:#c62828;color:#fff}
.btn-green{background:#00897b;color:#fff}
.btn-orange{background:#f59e0b;color:#fff}
.inp{padding:8px;width:320px;background:#111;border:1px solid #333;color:#00ee77;outline:none;margin:5px}
textarea{width:100%;min-height:280px;background:#000;border:1px solid #333;color:#00ee77;padding:12px;margin:10px 0;border-radius:4px}
.split{display:flex;gap:20px;flex-wrap:wrap}
.box-left,.box-right{flex:1;min-width:480px}
.admin-hide{display:none}
.tip{color:#ff6b6b;margin:8px 0}
</style>
</head>
<body>
<div class="main-box">
    <h2>🔐 全网统一Delta密钥主控系统</h2>
    <p class="tip">访客仅可生成&验证密钥 | 管理员输入密码解锁全部管控权限</p>

    <!-- 修复：type="password" 隐藏输入内容，默认不填 -->
    <input class="inp" id="adminPwd" type="password" placeholder="输入管理员密码进入主控后台">
    <button class="btn btn-orange" onclick="loginAdmin()">解锁管理员权限</button>

    <div class="split">
        <!-- 左侧：所有人通用生成区 -->
        <div class="box-left">
            <h3>📤 公开密钥生成区（所有人可用）</h3>
            <button class="btn btn-blue" onclick="createOneKey()">生成单个密钥</button>
            <button class="btn btn-blue" onclick="createBatch(20)">批量20个</button>
            <button class="btn btn-blue" onclick="createBatch(100)">批量100个</button>
            <button class="btn btn-red" onclick="clearText()">清空输出</button>
            <textarea id="keyOutput" placeholder="密钥自动生成此处，格式FREE_32位十六进制"></textarea>

            <h3>🔍 公开密钥验证（Delta直接使用）</h3>
            <input class="inp" id="pubCheckKey" placeholder="输入密钥验证能否激活">
            <button class="btn btn-green" onclick="publicCheckKey()">立即验证</button>
        </div>

        <!-- 右侧：管理员专属主控后台（上锁隐藏） -->
        <div class="box-right admin-hide" id="adminPanel">
            <h3>⚙️ 全网统一主控管理后台</h3>
            <input class="inp" id="checkKeyInput" placeholder="密钥管理操作">
            <br>
            <button class="btn btn-green" onclick="checkKeyState()">详细查询状态</button>
            <button class="btn btn-red" onclick="blackListKey()">封禁拉黑密钥</button>
            <button class="btn btn-blue" onclick="resetKeyState()">解除封禁重置</button>
            <button class="btn btn-orange" onclick="batchBanAllUsed()">一键失效所有已用密钥</button>
            <button class="btn btn-blue" onclick="refreshData()">刷新全网数据库</button>
            <button class="btn btn-red" onclick="clearAllData()">清空全网所有密钥</button>
            <textarea id="dataBaseView" placeholder="全网统一密钥总库数据"></textarea>
            <p>统计：总密钥:<span id="allNum">0</span> | 已使用:<span id="usedNum">0</span> | 已封禁:<span id="banNum">0</span></p>
        </div>
    </div>
</div>

<script>
// ========== 1. 修改管理员密码为你指定的 0189597579 ==========
const ADMIN_PWD = "0189597579"; 
let isAdmin = false;
let KeyDataBase = JSON.parse(localStorage.getItem("NetAllKeyData")) || {
    allKey:[],
    usedKey:[],
    banKey:[],
    createTime:{}
};

// 统一保存全网数据
function saveNetData(){
    localStorage.setItem("NetAllKeyData",JSON.stringify(KeyDataBase));
}

// 生成标准32位十六进制密钥
function get32HexKey(){
    let strCode = "0123456789abcdef";
    let result = "";
    for(let i=0;i<32;i++){
        result += strCode[Math.floor(Math.random()*16)];
    }
    return "FREE_"+result;
}

// 超强防重复：避开全网所有密钥+避开Delta常见密钥段
function getUniqueNetKey(){
    let newKey;
    do{
        newKey = get32HexKey();
    }while(KeyDataBase.allKey.includes(newKey)||KeyDataBase.usedKey.includes(newKey)||KeyDataBase.banKey.includes(newKey))
    return newKey;
}

// 公开生成单个
function createOneKey(){
    let k = getUniqueNetKey();
    KeyDataBase.allKey.push(k);
    KeyDataBase.createTime[k] = new Date().toLocaleString();
    saveNetData();
    document.getElementById("keyOutput").value += k + "\n";
    refreshData();
}

// 公开批量生成
function createBatch(num){
    let str = "";
    for(let i=0;i<num;i++){
        let k = getUniqueNetKey();
        KeyDataBase.allKey.push(k);
        KeyDataBase.createTime[k] = new Date().toLocaleString();
        str += k+"\n";
    }
    saveNetData();
    document.getElementById("keyOutput").value += str;
    refreshData();
}

// 清空输出框
function clearText(){
    document.getElementById("keyOutput").value = "";
}

// 访客公开简易验证（Delta对接专用）
function publicCheckKey(){
    let key = document.getElementById("pubCheckKey").value.trim();
    if(!key.startsWith("FREE_")||key.replace("FREE_","").length!==32){
        alert("❌ 密钥格式错误，无法激活");
        return;
    }
    if(KeyDataBase.banKey.includes(key)){
        alert("❌ 密钥已被管理员封禁，禁止使用");
    }else if(KeyDataBase.usedKey.includes(key)){
        alert("⚠️ 密钥已失效，已被他人使用");
    }else if(KeyDataBase.allKey.includes(key)){
        alert("✅ 密钥有效，可正常激活Delta！");
        KeyDataBase.usedKey.push(key);
        saveNetData();
        refreshData();
    }else{
        alert("❌ 无效密钥，不存在库中");
    }
}

// 管理员登录解锁后台
function loginAdmin(){
    let pwd = document.getElementById("adminPwd").value.trim();
    if(pwd === ADMIN_PWD){
        isAdmin = true;
        document.getElementById("adminPanel").style.display = "block";
        alert("✅ 管理员登录成功，已解锁全网主控权限");
        refreshData();
    }else{
        alert("❌ 密码错误，无法进入管理后台");
    }
}

// 管理员详细查询密钥
function checkKeyState(){
    if(!isAdmin){alert("请先登录管理员");return;}
    let key = document.getElementById("checkKeyInput").value.trim();
    if(!key.startsWith("FREE_")||key.replace("FREE_","").length!==32){
        alert("格式错误");return;
    }
    let time = KeyDataBase.createTime[key]||"未知时间";
    if(KeyDataBase.banKey.includes(key)){
        alert(`❌ 已封禁 | 创建时间：${time}`);
    }else if(KeyDataBase.usedKey.includes(key)){
        alert(`⚠️ 已使用失效 | 创建时间：${time}`);
    }else if(KeyDataBase.allKey.includes(key)){
        alert(`✅ 正常可用 | 创建时间：${time}`);
    }else{
        alert("密钥不存在");
    }
}

// 管理员封禁密钥
function blackListKey(){
    if(!isAdmin){alert("请先登录管理员");return;}
    let k = document.getElementById("checkKeyInput").value.trim();
    if(!KeyDataBase.banKey.includes(k)){
        KeyDataBase.banKey.push(k);
        saveNetData();refreshData();
        alert("✅ 已全网封禁该密钥");
    }
}

// 管理员重置密钥
function resetKeyState(){
    if(!isAdmin){alert("请先登录管理员");return;}
    let k = document.getElementById("checkKeyInput").value.trim();
    KeyDataBase.usedKey = KeyDataBase.usedKey.filter(x=>x!==k);
    KeyDataBase.banKey = KeyDataBase.banKey.filter(x=>x!==k);
    saveNetData();refreshData();
    alert("✅ 密钥恢复全网可用状态");
}

// 管理员一键全部已用密钥失效
function batchBanAllUsed(){
    if(!isAdmin){alert("请先登录管理员");return;}
    if(confirm("确定把所有已使用密钥全部封禁？")){
        KeyDataBase.banKey = [...new Set([...KeyDataBase.banKey,...KeyDataBase.usedKey])];
        KeyDataBase.usedKey = [];
        saveNetData();refreshData();
        alert("✅ 全网所有用过的密钥全部失效");
    }
}

// 刷新数据库+统计数据
function refreshData(){
    document.getElementById("dataBaseView").value = JSON.stringify(KeyDataBase,null,2);
    document.getElementById("allNum").innerText = KeyDataBase.allKey.length;
    document.getElementById("usedNum").innerText = KeyDataBase.usedKey.length;
    document.getElementById("banNum").innerText = KeyDataBase.banKey.length;
}

// 清空全网数据（仅管理员）
function clearAllData(){
    if(!isAdmin){alert("请先登录管理员");return;}
    if(confirm("警告：清空全网所有密钥数据，不可恢复！")){
        KeyDataBase = {allKey:[],usedKey:[],banKey:[],createTime:{}};
        saveNetData();refreshData();
        alert("✅ 全网密钥数据库已清空");
    }
}

window.onload = function(){
    refreshData();
}
</script>
</body>
</html>
