<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Delta密钥授权系统 安全防护版</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Consolas,"微软雅黑"}
body{background:#080808;color:#00ee77;padding:15px}
.main-box{max-width:1100px;margin:0 auto}
h2{color:#ffffff;margin:10px 0;border-bottom:1px solid #222;padding-bottom:8px}
.btn{padding:9px 18px;margin:5px;border:0;border-radius:3px;cursor:pointer;font-size:14px}
.btn-blue{background:#1967d2;color:#fff}
.btn-red{background:#c62828;color:#fff}
.btn-green{background:#00897b;color:#fff}
.btn-orange{background:#f59e0b;color:#fff}
.btn-google{background:#db4437;color:#fff}
.inp{padding:8px;width:320px;background:#111;border:1px solid #333;color:#00ee77;outline:none;margin:5px}
textarea{width:100%;min-height:220px;background:#000;border:1px solid #333;color:#00ee77;padding:12px;margin:10px 0;border-radius:4px}
.split{display:flex;gap:20px;flex-wrap:wrap}
.box-left,.box-right{flex:1;min-width:480px}
.admin-hide{display:none}
.tip{color:#ff6b6b;margin:8px 0}
.auth-box{text-align:center;padding:30px;border:1px solid #333;border-radius:8px;margin:20px 0}
.hide-content{display:none;}
.user-info{color:#ccc;margin:5px 0;font-size:14px}
.user-list-box{background:#111;padding:15px;border-radius:6px;margin:10px 0;max-height:200px;overflow:auto}
.firewall-tip{color:#4cd964;font-size:13px;margin:5px 0}
</style>
</head>
<body>
<div class="main-box">
    <h2>🔐 Delta全网密钥授权系统</h2>
    <p class="tip">一键快捷登录+手动注册双通道 | 固定7天凌晨0点自动过期 | 内置安全防火墙</p>
    <div class="firewall-tip">✅ 防火墙已启用：防篡改、防恶意刷取、防越权盗取数据</div>

    <div class="auth-box" id="authArea">
        <div id="googleLoginForm">
            <h3 style="color:#fff;margin-bottom:15px">检测到快捷登录账号</h3>
            <button class="btn btn-google" onclick="quickGoogleLogin()">一键直接登录</button>
            <p style="color:#999;margin-top:10px">暂无账号/未注册 → <a href="#" onclick="showManualLogin()">前往手动注册</a></p>
        </div>

        <div id="manualLoginForm" style="display:none;">
            <div id="loginForm">
                <h3 style="color:#fff;margin-bottom:15px">账号密码登录</h3>
                <input class="inp" id="loginUser" placeholder="输入用户名">
                <br>
                <input class="inp" id="loginPass" type="password" placeholder="输入密码">
                <br>
                <button class="btn btn-green" onclick="userLogin()">登录系统</button>
                <p style="color:#999;margin-top:10px">没有账号 <a href="#" onclick="showRegisterForm()">立即注册</a></p>
            </div>
            <div id="registerForm" style="display:none;">
                <h3 style="color:#fff;margin-bottom:15px">注册专属账号</h3>
                <input class="inp" id="regUser" placeholder="设置用户名">
                <br>
                <input class="inp" id="regPass" type="password" placeholder="设置登录密码">
                <br>
                <button class="btn btn-blue" onclick="userRegister()">完成注册</button>
                <p style="color:#999;margin-top:10px">已有账号 <a href="#" onclick="showLoginForm()">返回登录</a></p>
            </div>
        </div>
    </div>

    <div class="user-info" id="userInfo" style="display:none;">
        在线用户：<span id="currentUser"></span>
        <button class="btn btn-red" onclick="userLogout()">退出登录</button>
    </div>

    <input class="inp" id="adminPwd" type="password" placeholder="管理员专属密码">
    <button class="btn btn-orange" onclick="loginAdmin()">进入管理后台</button>

    <div class="split hide-content" id="mainContent">
        <div class="box-left">
            <h3>📤 密钥生成中心</h3>
            <button class="btn btn-blue" onclick="createOneKey()">生成单个密钥</button>
            <button class="btn btn-blue" onclick="createBatch(20)">批量生成20</button>
            <button class="btn btn-blue" onclick="createBatch(100)">批量生成100</button>
            <button class="btn btn-red" onclick="clearText()">清空输出</button>
            <textarea id="keyOutput" placeholder="生成的有效密钥自动显示此处"></textarea>

            <h3>🔍 密钥有效性验证</h3>
            <input class="inp" id="pubCheckKey" placeholder="粘贴密钥进行验证">
            <button class="btn btn-green" onclick="publicCheckKey()">验证是否可用</button>
        </div>

        <div class="box-right admin-hide" id="adminPanel">
            <h3>⚙️ 超级管理员后台</h3>
            <button class="btn btn-green" onclick="showAllUserList()">查看全部注册用户</button>
            <div class="user-list-box" id="userListBox"></div>
            <input class="inp" id="checkKeyInput" placeholder="输入密钥管理">
            <br>
            <button class="btn btn-green" onclick="checkKeyState()">查询密钥状态</button>
            <button class="btn btn-red" onclick="blackListKey()">封禁违规密钥</button>
            <button class="btn btn-blue" onclick="resetKeyState()">解除密钥封禁</button>
            <button class="btn btn-orange" onclick="batchBanAllUsed()">一键作废全部已用密钥</button>
            <button class="btn btn-red" onclick="clearAllData()">清空全网密钥库</button>
            <textarea id="dataBaseView"></textarea>
            <p>总密钥:<span id="allNum">0</span> | 已使用:<span id="usedNum">0</span> | 已封禁:<span id="banNum">0</span> | 已过期:<span id="outTimeNum">0</span></p>
        </div>
    </div>
</div>

<script>
const ADMIN_PWD = "0189597579";
const EXPIRE_DAY = 7;
const MAX_BATCH_RATE = 5;
let isAdmin = false;
let isUserLogin = false;
let currentUser = "";
let clickCount = 0;
let lastClickTime = 0;

const LOGIN_STATUS_KEY = "Delta_Safe_Login_Status";
const LOGIN_USER_KEY = "Delta_Safe_Current_User";
const SAFE_KEY = "FireWall_Protect_2026";

function safeSetItem(key,val){
    localStorage.setItem(SAFE_KEY+key,val);
}
function safeGetItem(key){
    return localStorage.getItem(SAFE_KEY+key);
}
function safeRemoveItem(key){
    localStorage.removeItem(SAFE_KEY+key);
}

let KeyDataBase = JSON.parse(safeGetItem("NetKeyData")) || {
    allKey:[],usedKey:[],banKey:[],outTimeKey:[],createDate:{}
};
let UserList = JSON.parse(safeGetItem("AllUserList")) || [];

function saveNetData(){safeSetItem("NetKeyData",JSON.stringify(KeyDataBase));}
function saveUserList(){safeSetItem("AllUserList",JSON.stringify(UserList));}

function firewallLimitCheck(){
    let now = Date.now();
    if(now - lastClickTime < 800){
        clickCount++;
        if(clickCount >= MAX_BATCH_RATE){
            alert("⚠️ 防火墙拦截：操作过于频繁，请稍后再试！");
            return false;
        }
    }else{
        clickCount = 1;
    }
    lastClickTime = now;
    return true;
}
function illegalCharFilter(str){
    return str.replace(/[<>{};'"\$%&]/g,"");
}

function quickGoogleLogin(){
    if(!firewallLimitCheck())return;
    let uName = "快捷登录用户_"+Math.random().toString(36).slice(2,9);
    safeSetItem(LOGIN_STATUS_KEY,"true");
    safeSetItem(LOGIN_USER_KEY,uName);
    isUserLogin = true;
    currentUser = uName;
    document.getElementById("authArea").style.display = "none";
    document.getElementById("userInfo").style.display = "block";
    document.getElementById("currentUser").innerText = uName;
    document.getElementById("mainContent").classList.remove("hide-content");
    alert("✅ 快捷登录成功，防火墙已全程防护");
}
function showManualLogin(){
    document.getElementById("googleLoginForm").style.display = "none";
    document.getElementById("manualLoginForm").style.display = "block";
}
function showRegisterForm(){
    document.getElementById("loginForm").style.display = "none";
    document.getElementById("registerForm").style.display = "block";
}
function showLoginForm(){
    document.getElementById("registerForm").style.display = "none";
    document.getElementById("loginForm").style.display = "block";
}
function userRegister(){
    if(!firewallLimitCheck())return;
    let user = illegalCharFilter(document.getElementById("regUser").value.trim());
    let pass = illegalCharFilter(document.getElementById("regPass").value.trim());
    if(!user||!pass){alert("账号密码不能为空");return;}
    if(UserList.some(x=>x.user===user)){alert("用户名已存在");return;}
    UserList.push({user:user,pwd:pass,regTime:new Date().toLocaleString()});
    saveUserList();
    alert("✅ 注册成功，请返回登录");
    showLoginForm();
}
function userLogin(){
    if(!firewallLimitCheck())return;
    let user = illegalCharFilter(document.getElementById("loginUser").value.trim());
    let pass = illegalCharFilter(document.getElementById("loginPass").value.trim());
    let find = UserList.find(x=>x.user===user&&x.pwd===pass);
    if(!find){alert("账号或密码错误");return;}
    safeSetItem(LOGIN_STATUS_KEY,"true");
    safeSetItem(LOGIN_USER_KEY,user);
    isUserLogin = true;
    currentUser = user;
    document.getElementById("authArea").style.display = "none";
    document.getElementById("userInfo").style.display = "block";
    document.getElementById("currentUser").innerText = user;
    document.getElementById("mainContent").classList.remove("hide-content");
    alert("✅ 登录成功，安全防护已开启");
}
function userLogout(){
    safeRemoveItem(LOGIN_STATUS_KEY);
    safeRemoveItem(LOGIN_USER_KEY);
    isUserLogin = false;currentUser = "";isAdmin = false;
    document.getElementById("authArea").style.display = "block";
    document.getElementById("userInfo").style.display = "none";
    document.getElementById("mainContent").classList.add("hide-content");
    document.getElementById("adminPanel").style.display = "none";
    document.getElementById("googleLoginForm").style.display = "block";
    document.getElementById("manualLoginForm").style.display = "none";
    alert("已安全退出登录");
}
function loadLoginState(){
    let stat = safeGetItem(LOGIN_STATUS_KEY);
    let user = safeGetItem(LOGIN_USER_KEY);
    if(stat==="true"&&user){
        isUserLogin=true;currentUser=user;
        document.getElementById("authArea").style.display="none";
        document.getElementById("userInfo").style.display="block";
        document.getElementById("currentUser").innerText=user;
        document.getElementById("mainContent").classList.remove("hide-content");
    }
}

function getZeroTimeStamp(d){
    let t=new Date(d);
    return new Date(t.getFullYear(),t.getMonth(),t.getDate(),0,0,0).getTime();
}
function isKeyOverdue(createStr){
    let create=new Date(createStr);
    let now=new Date();
    let cZero=getZeroTimeStamp(create);
    let nZero=getZeroTimeStamp(now);
    let day=Math.floor((nZero-cZero)/(1000*60*60*24));
    return day>=EXPIRE_DAY;
}
function clearOverdueKey(){
    let newArr=[];
    for(let k of KeyDataBase.allKey){
        let d=KeyDataBase.createDate[k];
        if(!d||!isKeyOverdue(d))newArr.push(k);
        else if(!KeyDataBase.outTimeKey.includes(k))KeyDataBase.outTimeKey.push(k);
    }
    KeyDataBase.allKey=newArr;
    saveNetData();
}

function getRandKey(){
    let str="0123456789abcdef",res="";
    for(let i=0;i<32;i++)res+=str[Math.floor(Math.random()*16)];
    return "FREE_"+res;
}
function getUniqueKey(){
    let k;
    do{k=getRandKey();}
    while(KeyDataBase.allKey.includes(k)||KeyDataBase.usedKey.includes(k)||KeyDataBase.banKey.includes(k)||KeyDataBase.outTimeKey.includes(k));
    return k;
}
function createOneKey(){
    if(!isUserLogin){alert("请先登录");return;}
    if(!firewallLimitCheck())return;
    clearOverdueKey();
    let k=getUniqueKey();
    KeyDataBase.allKey.push(k);
    KeyDataBase.createDate[k]=new Date().toLocaleDateString();
    saveNetData();
    document.getElementById("keyOutput").value+=k+"\n";
    refreshData();
}
function createBatch(num){
    if(!isUserLogin){alert("请先登录");return;}
    if(!firewallLimitCheck())return;
    clearOverdueKey();
    let txt="";
    for(let i=0;i<num;i++){
        let k=getUniqueKey();
        KeyDataBase.allKey.push(k);
        KeyDataBase.createDate[k]=new Date().toLocaleDateString();
        txt+=k+"\n";
    }
    saveNetData();
    document.getElementById("keyOutput").value+=txt;
    refreshData();
}
function clearText(){document.getElementById("keyOutput").value="";}

function publicCheckKey(){
    if(!isUserLogin){alert("请先登录");return;}
    if(!firewallLimitCheck())return;
    clearOverdueKey();
    let k=document.getElementById("pubCheckKey").value.trim();
    if(!k.startsWith("FREE_")||k.replace("FREE_","").length!==32){
        alert("❌ 密钥格式非法，防火墙已拦截");return;
    }
    if(KeyDataBase.outTimeKey.includes(k)){
        alert("❌ 已满7天凌晨0点自动过期，无法使用");return;
    }
    if(KeyDataBase.banKey.includes(k))alert("❌ 此密钥已被管理员封禁");
    else if(KeyDataBase.usedKey.includes(k))alert("⚠️ 密钥已使用立即失效");
    else if(KeyDataBase.allKey.includes(k)){
        alert("✅ 密钥有效，可正常激活使用");
        KeyDataBase.usedKey.push(k);
        saveNetData();refreshData();
    }else alert("❌ 无效不存在密钥");
}

function loginAdmin(){
    let p=document.getElementById("adminPwd").value.trim();
    if(p===ADMIN_PWD){
        isAdmin=true;
        document.getElementById("adminPanel").style.display="block";
        alert("✅ 管理员身份验证通过");
        refreshData();
    }else alert("❌ 管理员密码错误");
}
function showAllUserList(){
    if(!isAdmin){alert("仅限管理员查看");return;}
    let html="";
    if(UserList.length===0)html="<p style='color:#999'>暂无任何注册用户</p>";
    else{
        UserList.forEach((item,idx)=>{
            html+=`<p>${idx+1}. 账号：${item.user} | 注册时间：${item.regTime}</p>`;
        });
    }
    document.getElementById("userListBox").innerHTML=html;
}
function checkKeyState(){
    if(!isAdmin){alert("仅限管理员操作");return;}
    clearOverdueKey();
    let k=document.getElementById("checkKeyInput").value.trim();
    if(!k.startsWith("FREE_")){alert("密钥格式错误");return;}
    let d=KeyDataBase.createDate[k]||"未知";
    if(KeyDataBase.outTimeKey.includes(k))alert(`已7天凌晨0点过期 | 创建日期：${d}`);
    else if(KeyDataBase.banKey.includes(k))alert(`已封禁 | 创建日期：${d}`);
    else if(KeyDataBase.usedKey.includes(k))alert(`已使用失效 | 创建日期：${d}`);
    else if(KeyDataBase.allKey.includes(k))alert(`正常可用 | 创建日期：${d}`);
    else alert("密钥不存在");
}
function blackListKey(){
    if(!isAdmin)return;
    let k=document.getElementById("checkKeyInput").value.trim();
    if(!KeyDataBase.banKey.includes(k)){
        KeyDataBase.banKey.push(k);
        saveNetData();refreshData();alert("已成功全网封禁");
    }
}
function resetKeyState(){
    if(!isAdmin)return;
    let k=document.getElementById("checkKeyInput").value.trim();
    KeyDataBase.usedKey=KeyDataBase.usedKey.filter(x=>x!==k);
    KeyDataBase.banKey=KeyDataBase.banKey.filter(x=>x!==k);
    KeyDataBase.outTimeKey=KeyDataBase.outTimeKey.filter(x=>x!==k);
    saveNetData();refreshData();alert("已恢复密钥可用状态");
}
function batchBanAllUsed(){
    if(!isAdmin)return;
    if(confirm("确定作废所有已使用密钥？不可撤回！")){
        KeyDataBase.banKey=[...new Set([...KeyDataBase.banKey,...KeyDataBase.usedKey])];
        KeyDataBase.usedKey=[];
        saveNetData();refreshData();alert("全部已用密钥已作废");
    }
}
function clearAllData(){
    if(!isAdmin)return;
    if(confirm("警告：清空全网所有密钥数据，不可恢复！")){
        KeyDataBase={allKey:[],usedKey:[],banKey:[],outTimeKey:[],createDate:{}};
        saveNetData();refreshData();alert("✅ 全网密钥数据库已清空");
    }
}
function refreshData(){
    document.getElementById("dataBaseView").value=JSON.stringify(KeyDataBase,null,2);
    document.getElementById("allNum").innerText=KeyDataBase.allKey.length;
    document.getElementById("usedNum").innerText=KeyDataBase.usedKey.length;
    document.getElementById("banNum").innerText=KeyDataBase.banKey.length;
    document.getElementById("outTimeNum").innerText=KeyDataBase.outTimeKey.length;
}

window.onload=function(){
    loadLoginState();
    clearOverdueKey();
    refreshData();
}
</script>
</body>
</html>
