<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Delta同款无限密钥生成验证系统</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Consolas,"微软雅黑"}
body{background:#080808;color:#00ee77;padding:15px}
.main-box{max-width:1100px;margin:0 auto}
h2{color:#ffffff;margin:10px 0;border-bottom:1px solid #222;padding-bottom:8px}
.btn{padding:9px 18px;margin:5px;border:0;border-radius:3px;cursor:pointer;font-size:14px}
.btn-blue{background:#1967d2;color:#fff}
.btn-red{background:#c62828;color:#fff}
.btn-green{background:#00897b;color:#fff}
.inp{padding:8px;width:320px;background:#111;border:1px solid #333;color:#00ee77;outline:none}
textarea{width:100%;min-height:280px;background:#000;border:1px solid #333;color:#00ee77;padding:12px;margin:10px 0;border-radius:4px}
.split{display:flex;gap:20px;flex-wrap:wrap}
.box-left,.box-right{flex:1;min-width:480px}
</style>
</head>
<body>
<div class="main-box">
    <h2>🔐 无限密钥生成+后台验证一体化系统（防重复适配Delta）</h2>
    <div class="split">
        <!-- 左侧：密钥生成区 -->
        <div class="box-left">
            <h3>📤 密钥生成面板（永不重复）</h3>
            <button class="btn btn-blue" onclick="createOneKey()">生成单个密钥</button>
            <button class="btn btn-blue" onclick="createBatch(20)">批量20个</button>
            <button class="btn btn-blue" onclick="createBatch(100)">批量100个</button>
            <button class="btn btn-red" onclick="clearText()">清空输出</button>
            <textarea id="keyOutput" placeholder="密钥将自动生成在此处..."></textarea>
        </div>

        <!-- 右侧：后台管理验证区 -->
        <div class="box-right">
            <h3>⚙️ 后台密钥管理</h3>
            <input class="inp" id="checkKeyInput" placeholder="粘贴密钥进行操作">
            <br>
            <button class="btn btn-green" onclick="checkKeyState()">验证密钥状态</button>
            <button class="btn btn-red" onclick="blackListKey()">封禁加入黑名单</button>
            <button class="btn btn-blue" onclick="resetKeyState()">重置密钥状态</button>
            <button class="btn btn-blue" onclick="refreshData()">刷新数据库</button>
            <button class="btn btn-red" onclick="clearAllData()">清空全部数据</button>
            <textarea id="dataBaseView" placeholder="密钥数据库数据..."></textarea>
        </div>
    </div>
</div>

<script>
// 全局数据库存储
let KeyDataBase = JSON.parse(localStorage.getItem("AllKeyData")) || {
    allKey:[],
    usedKey:[],
    banKey:[]
};

// 保存数据
function saveLocalData(){
    localStorage.setItem("AllKeyData",JSON.stringify(KeyDataBase));
}

// 生成32位16进制密钥 FREE_开头
function get32HexKey(){
    let strCode = "0123456789abcdef";
    let result = "";
    for(let i=0;i<32;i++){
        result += strCode[Math.floor(Math.random()*16)];
    }
    return "FREE_"+result;
}

// 【核心防重复函数】反复生成直到拿到全新不重复密钥
function getUniqueKey(){
    let newKey;
    do{
        newKey = get32HexKey();
    // 判定：不在库存、不在已用、不在黑名单 = 全新密钥
    }while(KeyDataBase.allKey.includes(newKey) || KeyDataBase.usedKey.includes(newKey) || KeyDataBase.banKey.includes(newKey))
    return newKey;
}

// 生成单个密钥（强制不重复）
function createOneKey(){
    let newKey = getUniqueKey();
    KeyDataBase.allKey.push(newKey);
    saveLocalData();
    document.getElementById("keyOutput").value += newKey + "\n";
    refreshData();
}

// 批量生成密钥（全部防重复）
function createBatch(num){
    let allStr = "";
    for(let i=0;i<num;i++){
        let k = getUniqueKey();
        KeyDataBase.allKey.push(k);
        allStr += k + "\n";
    }
    saveLocalData();
    document.getElementById("keyOutput").value += allStr;
    refreshData();
}

// 清空生成框
function clearText(){
    document.getElementById("keyOutput").value = "";
}

// 刷新数据库显示
function refreshData(){
    document.getElementById("dataBaseView").value = JSON.stringify(KeyDataBase,null,2);
}

// 清空所有数据库
function clearAllData(){
    if(confirm("确定清空所有密钥数据？无法恢复！")){
        KeyDataBase = {allKey:[],usedKey:[],banKey:[]};
        saveLocalData();
        refreshData();
        alert("已清空全部密钥数据库");
    }
}

// 验证密钥状态（和Delta验证逻辑一致）
function checkKeyState(){
    let inputKey = document.getElementById("checkKeyInput").value.trim();
    if(!inputKey.startsWith("FREE_")){
        alert("格式错误！必须以 FREE_ 开头");
        return;
    }
    let hexPart = inputKey.replace("FREE_","");
    if(hexPart.length !== 32){
        alert("密钥位数错误，必须32位十六进制");
        return;
    }
    if(KeyDataBase.banKey.includes(inputKey)){
        alert("❌ 该密钥已被封禁，禁止使用");
    }else if(KeyDataBase.usedKey.includes(inputKey)){
        alert("⚠️ 该密钥已被使用，已失效");
    }else if(KeyDataBase.allKey.includes(inputKey)){
        alert("✅ 密钥合法有效，验证通过！");
        KeyDataBase.usedKey.push(inputKey);
        saveLocalData();
        refreshData();
    }else{
        alert("❌ 不存在此密钥");
    }
}

// 封禁密钥
function blackListKey(){
    let bKey = document.getElementById("checkKeyInput").value.trim();
    if(!KeyDataBase.banKey.includes(bKey)){
        KeyDataBase.banKey.push(bKey);
        saveLocalData();
        refreshData();
        alert("✅ 成功封禁该密钥，加入黑名单");
    }else{
        alert("该密钥已在黑名单内");
    }
}

// 重置密钥状态
function resetKeyState(){
    let rKey = document.getElementById("checkKeyInput").value.trim();
    KeyDataBase.usedKey = KeyDataBase.usedKey.filter(item=>item!==rKey);
    KeyDataBase.banKey = KeyDataBase.banKey.filter(item=>item!==rKey);
    saveLocalData();
    refreshData();
    alert("✅ 密钥已解除封禁+解除已使用，恢复可用");
}

// 页面初始化加载数据
window.onload = function(){
    refreshData();
}
</script>
</body>
</html>
