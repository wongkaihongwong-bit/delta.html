input,button,select,textarea{padding:8px;margin:5px;border-radius:4px;border:1px solid #ccc;}
button{cursor:pointer;background:#2196F3;color:white;border:none;}
h3{margin:10px 0;}
.flex{display:flex;gap:10px;flex-wrap:wrap;}
.lang-box{text-align:right;margin-bottom:10px;}
.envelope-badge{background:red;color:white;border-radius:50%;padding:2px 6px;font-size:12px;}
.envelope-item{border:1px solid #ddd;padding:10px;margin:5px 0;border-radius:4px;}

<div id="app">

let currentLang = "zh";

// 语言切换函数
function switchLanguage(){
    currentLang = document.getElementById("langSelect").value;
    let lang = langData[currentLang];
    document.querySelectorAll("[data-lang]").forEach(el=>{
        let key = el.getAttribute("data-lang");
        el.innerText = lang[key];
    });
    document.querySelectorAll("[data-placeholder]").forEach(el=>{
        let key = el.getAttribute("data-placeholder");
        el.placeholder = lang[key];
    });
}

// ========== 全局存储数据 ==========
let users = JSON.parse(localStorage.getItem("sysUsers")) || {};
let keysData = JSON.parse(localStorage.getItem("sysKeys")) || {};
let blackList = JSON.parse(localStorage.getItem("sysBlack")) || [];
let friendList = JSON.parse(localStorage.getItem("sysFriend")) || {};
let groupList = JSON.parse(localStorage.getItem("sysGroup")) || [];

// 管理员账号密码

const ADMIN_PASSWORD = "0102030405060708090";

// 会员配置参数
const MONTH_PRICE = 10;

const MONTH_KEY_NUM = 2;
const MONTH_KEY_VALID = 60;
const YEAR_CREATE_ACC_NUM = 2;
const NORMAL_KEY_RESET_DAY = 7;

// 保存所有数据
function saveAllData(){
    localStorage.setItem("sysUsers",JSON.stringify(users));
    localStorage.setItem("sysKeys",JSON.stringify(keysData));
    localStorage.setItem("sysBlack",JSON.stringify(blackList));
    localStorage.setItem("sysFriend",JSON.stringify(friendList));
    localStorage.setItem("sysGroup",JSON.stringify(groupList));
    localStorage.setItem("sysTickets",JSON.stringify(tickets));
}

// 生成分段随机ID
function createRandomID(){
    let str = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789";
    let id = "";
    for(let i=0;i<12;i++){
        id += str.charAt(Math.floor(Math.random()*str.length));
    }
    return id.slice(0,4)+" "+id.slice(4,8)+" "+id.slice(8,12);
}

// 获取随机头像
function getRandomAvatar(){
    let avatarArr = [
        "https://picsum.photos/100/100?random=1",
        "https://picsum.photos/100/100?random=2",
        "https://picsum.photos/100/100?random=3"
    ];
    return avatarArr[Math.floor(Math.random()*avatarArr.length)];
}

// 计算年龄
function getUserAge(birth){
    let birthDate = new Date(birth);
    let now = new Date();
    let age = now.getFullYear() - birthDate.getFullYear();
    let m = now.getMonth() - birthDate.getMonth();
    if(m<0 || (m===0 && now.getDate()<birthDate.getDate())) age--;
    return age;
}

// 用户注册
function userRegister(){
    let mail = document.getElementById("regMail").value.trim();
    let pwd = document.getElementById("regPwd").value.trim();
    let avatar = document.getElementById("userAvatar").value.trim();
    let birth = document.getElementById("birthDay").value;
    let lang = langData[currentLang];

    if(!mail || !pwd || !birth){
        alert(lang.alert_empty);
        return;
    }
    if(!mail.includes("@gmail.com")){
        alert(lang.alert_gmail);
        return;
    }
    if(users[mail]){
        alert(lang.alert_accExist);
        return;
    }

    let age = getUserAge(birth);
    let userID = createRandomID();
    let userAvatar = avatar || getRandomAvatar();
    let isChildBan = age < 13;

    let userInfo = {
        uid:userID,
        email:mail,
        password:pwd,
        avatar:userAvatar,
        birth:birth,
        age:age,
        isBlack:isChildBan,
        memberType:"normal",
        memberStack:0,
        keyStock:0,
        lastKeyUse:new Date().getTime(),
        createAccNum:0
    };
    users[mail] = userInfo;
    if(isChildBan) blackList.push(mail);
    saveAllData();
    if(isChildBan){
        alert(lang.alert_under13);
    }else{
        alert(lang.alert_regSuccess);
    }
}

// 用户登录
function userLogin(){
    let mail = document.getElementById("regMail").value.trim();
    let pwd = document.getElementById("regPwd").value.trim();
    let lang = langData[currentLang];

    if(!users[mail]){
        alert(lang.alert_noAcc);
        return;
    }
    if(users[mail].password !== pwd){
        alert(lang.alert_pwdError);
        return;
    }
    if(blackList.includes(mail)){
        alert(lang.alert_blackBan);
        return;
    }

    currentLoginUser = mail;
    document.getElementById("loginBox").style.display = "none";
    document.getElementById("userPanel").style.display = "block";
    renderUserInfo();
}

// 渲染用户信息
function renderUserInfo(){
    let u = users[currentLoginUser];
    document.getElementById("userInfo").innerText =
    `个人ID：${u.uid}\n邮箱账号：${u.email}\n出生日期：${u.birth}`;
}

    document.getElementById("userPanel").style.display = "none";
}

    let acc = document.getElementById("adminAcc").value.trim();

        document.getElementById("adminLoginBox").style.display = "none";
        document.getElementById("adminPanel").style.display = "block";
        refreshEnvelopeCount();
    }else{
        alert("账号密码错误");
    }
}

// 管理员手动创建账号
function adminCreateAccount(){
    let mail = document.getElementById("makeAcc").value.trim();
    let pwd = document.getElementById("makePwd").value.trim();
    if(!mail||!pwd||!mail.includes("@gmail.com")){
        alert("请填写合法gmail账号与密码");
        return;
    }
    if(users[mail]){
        alert("账号已存在");
        return;
    }
    let userID = createRandomID();
    let userAvatar = getRandomAvatar();
    users[mail] = {
        uid:userID,
        email:mail,
        password:pwd,
        avatar:userAvatar,
        birth:"",
        age:0,
        isBlack:false,
        memberType:"normal",
        memberStack:0,
        keyStock:0,
        lastKeyUse:new Date().getTime(),
        createAccNum:0
    };
    saveAllData();
    alert("账号创建成功");
}

// 授予月会员
function giveMonthMember(){
    let acc = document.getElementById("grantAcc").value.trim();
    if(!users[acc]){
        alert("用户不存在");
        return;
    }
    let user = users[acc];
    user.memberType = "month";
    user.memberStack += 1;
    user.keyStock += MONTH_KEY_NUM;
    saveAllData();
    alert(langData[currentLang].alert_grantSuccess);
}

// 授予年会员
function giveYearMember(){
    let acc = document.getElementById("grantAcc").value.trim();
    if(!users[acc]){
        alert("用户不存在");
        return;
    }
    let user = users[acc];
    user.memberType = "year";
    user.memberStack += 1;
    user.keyStock += MONTH_KEY_NUM;
    user.createAccNum += YEAR_CREATE_ACC_NUM;
    saveAllData();
    alert(langData[currentLang].alert_grantSuccess);
}
