<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Delta全网统一密钥主控系统</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Consolas,"微软雅黑"}
body{background:#080808;color:#00ee77;padding:15px}
.main-box{max-width:1100px;margin:0 auto}
h2{color:#ffffff;margin:10px 0;border-bottom:1px solid #222;padding-bottom:8px}
.btn{padding:9px 18px;margin:5px;border:0;border-radius:3px;cursor:pointer;font-size:14px}
.btn-blue{background:#1967d2;color:#fff}
.btn-red{background:#c62828;color:#fff}
.btn-green{background:#00897b;color:#fff}
.btn-orange{background:#f59e0b;color:#fff}
.btn-google{background:#db4437;color:#fff}
.btn-fb{background:#4267b2;color:#fff}
.btn-ins{background:#c13584;color:#fff}
.btn-wechat{background:#07c160;color:#fff}
.inp{padding:8px;width:320px;background:#111;border:1px solid #333;color:#00ee77;outline:none;margin:5px}
textarea{width:100%;min-height:280px;background:#000;border:1px solid #333;color:#00ee77;padding:12px;margin:10px 0;border-radius:4px}
.split{display:flex;gap:20px;flex-wrap:wrap}
.box-left,.box-right{flex:1;min-width:480px}
.admin-hide{display:none}
.tip{color:#ff6b6b;margin:8px 0}
.login-box{text-align:center;padding:30px;border:1px solid #333;border-radius:8px;margin:20px 0}
.hide-content{display:none;}
.user-info{color:#ccc;margin:5px 0;font-size:14px}
</style>
</head>
<body>
<div class="main-box">
    <h2>🔐 全网统一Delta密钥主控系统</h2>
    <p class="tip">登录永久留存 | 密钥7天后凌晨0点统一自动失效 | 独立时效不与Delta冲突</p>

    <div class="login-box" id="loginArea">
        <h3 style="color:#fff;margin-bottom:15px">请选择账号登录</h3>
        <button class="btn btn-google" onclick="loginGoogle()">Google登录</button>
        <button class="btn btn-fb" onclick="loginFacebook()">Facebook登录</button>
        <button class="btn btn-ins" onclick="loginIns()">Instagram登录</button>
        <button class="btn btn-wechat" onclick="loginWechat()">微信登录</button>
        <p style="color:#999;margin-top:15px">未登录无法使用密钥功能</p>
    </div>

    <div class="user-info" id="userInfo" style="display:none;">
        已登录：<span id="loginType"></span>
        <button class="btn btn-red" onclick="userLogout()">退出登录</button>
    </div>

    <input class="inp" id="adminPwd" type="password" placeholder="管理员密码">
    <button class="btn btn-orange" onclick="loginAdmin()">解锁后台</button>

    <div class="split hide-content" id="mainContent">
        <div class="box-left">
            <h3>📤 密钥生成区（登录可用）</h3>
            <button class="btn btn-blue" onclick="createOneKey()">生成1个</button>
            <button class="btn btn-blue" onclick="createBatch(20)">批量20</button>
            <button class="btn btn-blue" onclick="createBatch(100)">批量100</button>
            <button class="btn btn-red" onclick="clearText()">清空</button>
            <textarea id="keyOutput" placeholder="FREE_32位密钥"></textarea>

            <h3>🔍 Delta密钥验证</h3>
            <input class="inp" id="pubCheckKey" placeholder="输入密钥">
            <button class="btn btn-green" onclick="publicCheckKey()">验证激活</button>
        </div>

        <div class="box-right admin-hide" id="adminPanel">
            <h3>⚙️ 全网主控后台</h3>
            <input class="inp" id="checkKeyInput" placeholder="密钥操作">
            <br>
            <button class="btn btn-green" onclick="checkKeyState()">查询状态</button>
            <button class="btn btn-red" onclick="blackListKey()">封禁密钥</button>
            <button class="btn btn-blue" onclick="resetKeyState()">解除封禁</button>
            <button class="btn btn-orange" onclick="batchBanAllUsed()">一键失效所有已用</button>
            <button class="btn btn-blue" onclick="refreshData()">刷新数据库</button>
            <button class="btn btn-red" onclick="clearAllData()">清空全网数据</button>
            <textarea id="dataBaseView"></textarea>
            <p>总:<span id="allNum">0</span> | 已用:<span id="usedNum">0</span> | 封禁:<span id="banNum">0</span> | 已过期:<span id="outTimeNum">0</span></p>
        </div>
    </div>
</div>

<script>
const ADMIN_PWD = "0189597579";
const EXPIRE_DAY = 7;

let isAdmin = false;
let isUserLogin = false;
let loginType = "";

const LOGIN_STATUS_KEY = "Delta_User_Login_Status";
const LOGIN_TYPE_KEY = "Delta_User_Login_Type";

let KeyDataBase = JSON.parse(localStorage.getItem("NetAllKeyData")) || {
    allKey:[],
    usedKey:[],
    banKey:[],
    outTimeKey:[],
    createDate:{}
};

function saveNetData(){
    localStorage.setItem("NetAllKeyData", JSON.stringify(KeyDataBase));
}

// 获取当天凌晨0点时间戳
function getZeroTimeStamp(dateObj){
    let d = new Date(dateObj);
    return new Date(d.getFullYear(),d.getMonth(),d.getDate(),0,0,0).getTime();
}

// 7天后凌晨0点过期判断
function isKeyExpired(createDateStr){
    let createDate = new Date(createDateStr);
    let now = new Date();
    let createZero = getZeroTimeStamp(createDate);
    let nowZero = getZeroTimeStamp(now);
    let diffDay = Math.floor((nowZero - createZero) / (1000*60*60*24));
    return diffDay >= EXPIRE_DAY;
}

// 自动清理7天凌晨0点过期密钥
function clear7DayExpire(){
    let newAllKey = [];
    for(let key of KeyDataBase.allKey){
        let cDate = KeyDataBase.createDate[key];
        if(!cDate || !isKeyExpired(cDate)){
            newAllKey.push(key);
        }else{
            if(!KeyDataBase.outTimeKey.includes(key)){
                KeyDataBase.outTimeKey.push(key);
            }
        }
    }
    KeyDataBase.allKey = newAllKey;
    saveNetData();
}

// 登录持久化
function saveLoginState(type){
    localStorage.setItem(LOGIN_STATUS_KEY, "true");
    localStorage.setItem(LOGIN_TYPE_KEY, type);
    isUserLogin = true;
    loginType = type;
}
function clearLoginState(){
    localStorage.removeItem(LOGIN_STATUS_KEY);
    localStorage.removeItem(LOGIN_TYPE_KEY);
    isUserLogin = false;
    loginType = "";
}
function loadLoginState(){
    let status = localStorage.getItem(LOGIN_STATUS_KEY);
    let type = localStorage.getItem(LOGIN_TYPE_KEY);
    if(status === "true" && type){
        isUserLogin = true;
        loginType = type;
        document.getElementById("loginArea").style.display = "none";
        document.getElementById("userInfo").style.display = "block";
        document.getElementById("loginType").innerText = type;
        document.getElementById("mainContent").classList.remove("hide-content");
    }
}

function loginGoogle(){saveLoginState("Google账号");afterLogin();}
function loginFacebook(){saveLoginState("Facebook账号");afterLogin();}
function loginIns(){saveLoginState("Instagram账号");afterLogin();}
function loginWechat(){saveLoginState("微信账号");afterLogin();}
function afterLogin(){
    document.getElementById("loginArea").style.display = "none";
    document.getElementById("userInfo").style.display = "block";
    document.getElementById("loginType").innerText = loginType;
    document.getElementById("mainContent").classList.remove("hide-content");
    alert(`✅ ${loginType} 登录成功，永久保存登录状态`);
}
function userLogout(){
    clearLoginState();
    document.getElementById("loginArea").style.display = "block";
    document.getElementById("userInfo").style.display = "none";
    document.getElementById("mainContent").classList.add("hide-content");
    alert("已退出登录");
}

function get32HexKey(){
    let s="0123456789abcdef",r="";
    for(let i=0;i<32;i++)r+=s[Math.floor(Math.random()*16)];
    return "FREE_"+r;
}
function getUniqueNetKey(){
    let k;
    do{k=get32HexKey();}
    while(KeyDataBase.allKey.includes(k)||KeyDataBase.usedKey.includes(k)||KeyDataBase.banKey.includes(k)||KeyDataBase.outTimeKey.includes(k));
    return k;
}

function createOneKey(){
    if(!isUserLogin){alert("请先登录！");return;}
    clear7DayExpire();
    let k=getUniqueNetKey();
    KeyDataBase.allKey.push(k);
    KeyDataBase.createDate[k] = new Date().toLocaleDateString();
    saveNetData();
    document.getElementById("keyOutput").value+=k+"\n";
    refreshData();
}
function createBatch(n){
    if(!isUserLogin){alert("请先登录！");return;}
    clear7DayExpire();
    let t="";
    for(let i=0;i<n;i++){
        let k=getUniqueNetKey();
        KeyDataBase.allKey.push(k);
        KeyDataBase.createDate[k] = new Date().toLocaleDateString();
        t+=k+"\n";
    }
    saveNetData();
    document.getElementById("keyOutput").value+=t;
    refreshData();
}
function clearText(){document.getElementById("keyOutput").value="";}

function publicCheckKey(){
    if(!isUserLogin){alert("请先登录！");return;}
    clear7DayExpire();
    let k=document.getElementById("pubCheckKey").value.trim();
    if(!k.startsWith("FREE_")||k.replace("FREE_","").length!=32){
        alert("❌ 密钥格式错误");return;
    }
    if(KeyDataBase.outTimeKey.includes(k)){
        alert("❌ 密钥已满7天凌晨0点，自动过期无法使用");
        return;
    }
    if(KeyDataBase.banKey.includes(k)){
        alert("❌ 已被管理员封禁");
    }else if(KeyDataBase.usedKey.includes(k)){
        alert("⚠️ 已使用立即失效");
    }else if(KeyDataBase.allKey.includes(k)){
        alert("✅ 密钥有效，可正常激活Delta！");
        KeyDataBase.usedKey.push(k);
        saveNetData();refreshData();
    }else{
        alert("❌ 无效密钥");
    }
}

function loginAdmin(){
    let p=document.getElementById("adminPwd").value.trim();
    if(p===ADMIN_PWD){
        isAdmin=true;
        document.getElementById("adminPanel").style.display="block";
        alert("✅ 管理员登录成功");
        refreshData();
    }else{
        alert("❌ 密码错误");
    }
}
function checkKeyState(){
    if(!isAdmin){alert("请先登录管理员");return;}
    clear7DayExpire();
    let k=document.getElementById("checkKeyInput").value.trim();
    if(!k.startsWith("FREE_")||k.replace("FREE_","").length!=32){alert("格式错误");return;}
    let cDate=KeyDataBase.createDate[k]||"未知日期";
    if(KeyDataBase.outTimeKey.includes(k))alert(`❌ 已满7天凌晨0点过期 | 创建日期：${cDate}`);
    else if(KeyDataBase.banKey.includes(k))alert(`❌ 已封禁 | 创建日期：${cDate}`);
    else if(KeyDataBase.usedKey.includes(k))alert(`⚠️ 已使用失效 | 创建日期：${cDate}`);
    else if(KeyDataBase.allKey.includes(k))alert(`✅ 正常可用 | 创建日期：${cDate}`);
    else alert("密钥不存在");
}
function blackListKey(){
    if(!isAdmin){alert("请先登录管理员");return;}
    let k=document.getElementById("checkKeyInput").value.trim();
    if(!KeyDataBase.banKey.includes(k)){
        KeyDataBase.banKey.push(k);
        saveNetData();refreshData();alert("✅ 全网封禁成功");
    }
}
function resetKeyState(){
    if(!isAdmin){alert("请先登录管理员");return;}
    let k=document.getElementById("checkKeyInput").value.trim();
    KeyDataBase.usedKey=KeyDataBase.usedKey.filter(x=>x!=k);
    KeyDataBase.banKey=KeyDataBase.banKey.filter(x=>x!=k);
    KeyDataBase.outTimeKey=KeyDataBase.outTimeKey.filter(x=>x!=k);
    saveNetData();refreshData();alert("✅ 密钥恢复可用状态");
}
function batchBanAllUsed(){
    if(!isAdmin){alert("请先登录管理员");return;}
    if(confirm("确定封禁所有已使用密钥？")){
        KeyDataBase.banKey=[...new Set([...KeyDataBase.banKey,...KeyDataBase.usedKey])];
        KeyDataBase.usedKey=[];
        saveNetData();refreshData();alert("✅ 全部已用密钥一键失效");
    }
}
function refreshData(){
    document.getElementById("dataBaseView").value=JSON.stringify(KeyDataBase,null,2);
    document.getElementById("allNum").innerText=KeyDataBase.allKey.length;
    document.getElementById("usedNum").innerText=KeyDataBase.usedKey.length;
    document.getElementById("banNum").innerText=KeyDataBase.banKey.length;
    document.getElementById("outTimeNum").innerText=KeyDataBase.outTimeKey.length;
}
function clearAllData(){
    if(!isAdmin){alert("请先登录管理员");return;}
    if(confirm("警告：清空全网所有密钥数据，不可恢复！")){
        KeyDataBase={allKey:[],usedKey:[],banKey:[],outTimeKey:[],createDate:{}};
        saveNetData();refreshData();alert("✅ 全网密钥数据库已清空");
    }
}

window.onload=function(){
    loadLoginState();
    clear7DayExpire();
    refreshData();
}
</script>
</body>
</html>
